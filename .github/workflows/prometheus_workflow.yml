# This workflow is a CI/CD (CD part to come I guess) for the 
# Prometheus hobby-project. It is triggered by pushes to the master/develop or feature branches
# and pull requests to the master/develop branches.
# It installs Python dependencies, runs tests, and builds the project.

name: Prometheus CI/CD workflow

on:
  push:
    branches: [master, develop, 'feature/**']
  
  pull_request:
    branches: [master, develop]

jobs:
  metadata:
    name: Gather metadata
    runs-on: ubuntu-latest
    steps:
      - run: echo "Event Type - ${{ github.event_name }}"
      - run: echo "Event Triggered By - ${{ github.actor }}" 
      - run: echo "Branch name - ${{ github.ref }}"
      - run: echo "Job Runner - ${{ runner.os }}"

  build:
    name: Build and Test
    needs: metadata
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9","3.10","3.11"]
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then  pip install -r requirements.txt; fi
      
      - name: Run pytest
        run: |
          pytest